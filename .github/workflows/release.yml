name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . && claude plugin validate ./plugins/juicebot
      - run: scripts/package.sh juicebot
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/juicebot.plugin
          generate_release_notes: true
